service: ndvi-pipeline
frameworkVersion: '3.*'
useDotenv: true
configValidationMode: error

provider:
  name: aws
  runtime: python3.11
  region: eu-north-1
  stage: dev
  profile: AWS-step-functions
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - states:StartExecution
          Resource: "*"
  ecr:
    images:
      # processor-image poistettu: processor on nyt Node.js-funktio
      classifier-image:
        path: .
        file: Dockerfile.classifier
        platform: linux/amd64

plugins:
  - serverless-step-functions
  - serverless-python-requirements

functions:
  distributor:
    handler: dist/functions/distributor/handler.handler
    runtime: nodejs20.x
    memorySize: 256
    timeout: 10
    environment:
      STEP_FUNCTION_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ndviWorkflow"
      SECRET: ${env:SECRET}   # JWT:n tarkistus (userId)
    events:
      - httpApi:
          path: /process
          method: post

  ndviDates:
    handler: dist/functions/ndviDates/handler.handler
    runtime: nodejs20.x
    memorySize: 512
    timeout: 120   # syncDates + sää usealta kasvukaudelta
    environment:
      MONGO_URI: ${env:MONGO_URI}
      SECRET: ${env:SECRET}
      CDSE_CLIENT_ID: ${env:CDSE_CLIENT_ID}
      CDSE_CLIENT_SECRET: ${env:CDSE_CLIENT_SECRET}

  # Uusi nimi (ei enää "processor"): Docker-image -> zip vaatii uuden resurssin
  imageProcessor:
    handler: dist/functions/processor/handler.handler
    runtime: nodejs20.x
    memorySize: 1024
    timeout: 60
    environment:
      MONGO_URI: ${env:MONGO_URI}
      SECRET: ${env:SECRET}
      CDSE_CLIENT_ID: ${env:CDSE_CLIENT_ID}
      CDSE_CLIENT_SECRET: ${env:CDSE_CLIENT_SECRET}

  classifier:
    image:
      name: classifier-image
    timeout: 120
    memorySize: 3008

  authRegister:
    handler: dist/functions/auth/handler.register
    runtime: nodejs20.x
    memorySize: 256
    timeout: 10
    environment:
      MONGO_URI: ${env:MONGO_URI}
      SECRET: ${env:SECRET}
    events:
      - httpApi:
          path: /auth/register
          method: post

  authLogin:
    handler: dist/functions/auth/handler.login
    runtime: nodejs20.x
    memorySize: 256
    timeout: 10
    environment:
      MONGO_URI: ${env:MONGO_URI}
      SECRET: ${env:SECRET}
    events:
      - httpApi:
          path: /auth/login
          method: post

stepFunctions:
  stateMachines:
    ndviWorkflow:
      name: ndviWorkflow
      definition:
        StartAt: distributor
        States:
          distributor:
            Type: Task
            Resource:
              Fn::GetAtt: [DistributorLambdaFunction, Arn]
            Next: forEachField

          forEachField:
            Type: Map
            ItemsPath: $.fields
            MaxConcurrency: 2
            Iterator:
              StartAt: ndviDates
              States:
                ndviDates:
                  Type: Task
                  Resource:
                    Fn::GetAtt: [NdviDatesLambdaFunction, Arn]
                  Next: forEachDate

                forEachDate:
                  Type: Map
                  ItemsPath: $.items
                  MaxConcurrency: 5
                  ItemSelector:
                    item.$: $$.Map.Item.Value
                    geometry.$: $.geometry
                  ResultPath: null   # processorien tulokset pois (payload-raja 256 KB)
                  Iterator:
                    StartAt: processor
                    States:
                      processor:
                        Type: Task
                        Resource:
                          Fn::GetAtt: [ImageProcessorLambdaFunction, Arn]
                        End: true
                  Next: fieldDone

                fieldDone:
                  Type: Pass
                  Parameters:
                    field_id.$: $.field_id
                    done: true
                  End: true
            End: true